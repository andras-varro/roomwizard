# /etc/bluetooth/input.conf -- installed by the bluetooth provision group. Minimal on purpose:
# every key not set here keeps BlueZ 5.66's built-in default.
#
# ClassicBondedOnly: accept a classic (BR/EDR) HID connection only from a BONDED device.
# CVE-2023-45866: with it false, which is 5.66's default (profiles/input/device.c,
# classic_bonded_only = false), an unpaired attacker in radio range can open the HID
# channels and type into whatever holds the keyboard's event node. BlueZ 5.71 flipped the
# default to true; 5.66 reads the key (profiles/input/manager.c), so setting it here is the
# whole fix -- no source patch.
#
# It depends on main.conf's AlwaysPairable=true: without it 5.66 clears the bondable flag
# while no agent is registered, a bluetoothctl pair stores no link key ("Bonded: no"), and
# this key then rejects that pad ("Rejected connection from !bonded device" in the log).
[General]
ClassicBondedOnly=true
