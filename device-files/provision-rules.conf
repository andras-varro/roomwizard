#
# provision-rules.conf — everything a commissioned RoomWizard ends up WITH, as DATA.
#
# The install half of what device-files/clean-rules.conf is for the delete half.
# IMPROVEMENT_PLAN.md C12.
#
# ── One list, two consumers ─────────────────────────────────────────────────
#
# Read by lib/rw-provision.sh, which compiles it into a plan for whichever executor is
# running:
#
#   commissioning/provision.sh         live, over SSH, targets are already correct
#   commissioning/commission-offline.sh   offline, card in a reader, targets get $BASE/root
#
# Before this file existed the two wrote the list out separately — five scp/put
# calls, seven ln -sf calls, four sshd edits, each in two places — and they HAD
# drifted: the online path deleted stale rc*.d links before relinking and the
# offline path did not, so a card carrying an old S50roomwizard-app came out of
# offline commissioning with two links to the same init script at two priorities.
#
# ── Format: six TAB-separated fields ────────────────────────────────────────
#
#     <type>	<group>	<mode>	<target>	<source>	<reason>
#
# Blank lines and #-comments are ignored. Fewer than six fields is an ERROR, and so
# is an empty one: a missing reason is how a change gets in without anyone having to
# justify it. Use "-" for a field a type does not need — explicit, greppable, and
# distinguishable from "somebody left it blank".
#
# Every column means ONE thing for every type, so `awk -F'\t' '$3 != "-"'` really is
# "everything with a declared mode":
#
#   type       mode      target                     source
#   ────────────────────────────────────────────────────────────────────────────
#   install    0755      device path to write       repo-relative file to copy
#   link       -         the symlink to create      link target, verbatim
#   link-opt   -         ditto                      ditto; SKIPPED if it resolves
#                                                   to nothing on this image
#   unlink     -         device path or glob        -
#   touch      0644      device path                -
#   directive  -         config file                Key=Value  (written "Key Value")
#   backup     -         the copy to create         the file to copy from
#   dropline   -         config file                ERE; matching lines are removed
#
# ── ⚠️ Modes are DECLARED here, never read off disk ─────────────────────────
#
# Same rule as lib/rw-bundle.sh, same reason: /mnt/c is DrvFs, reports every file 0777
# and discards chmod, so a mode derived from the source on this host would be a
# constant rather than a measurement (CLAUDE.md). This file is the authority; the
# +x assertion in commissioning/commission-offline.sh's verify phase is a real measurement only
# because it runs against ext4.
#
# ── ⚠️ A link source must be RELATIVE ─────────────────────────────────────────
#
# "../init.d/time-sync", never "/etc/init.d/time-sync". An absolute symlink target
# is correct on a running device and DANGLING on a mounted card, where /etc is at
# $BASE/root/etc — and a dangling rc5.d link is skipped silently at boot. It is the
# one defect this file could introduce that nothing downstream would catch, so
# rw_provision_validate rejects it.
#
# ── ⚠️ Every link target must be on clean-rules.conf's keep list ─────────────
#
# A boot link installed here that the whitelist does not name is deleted by the
# next --deep-clean. That consistency used to be a comment in both files asking a
# human to remember; rw_provision_check_keeps now asserts it, because both files
# parse.
#
# ── ⚠️ rc0.d and rc6.d are unreachable from here ─────────────────────────────
#
# Shutdown, not startup. Same construction guarantee as clean-rules.conf and as p1's
# absence from RW_PART_ROLES. Note the consequence for `unlink` below.

# ═══════════════════════════════════════════════════════════════════════════
# Stale boot links, removed before anything is linked
# ═══════════════════════════════════════════════════════════════════════════
#
# THE drift this file fixes. Only the online path did this, so an offline-
# commissioned card that had ever carried an older install kept both links.
#
# `update-rc.d -f <name> remove` is deliberately NOT reproduced. It would also
# remove K links from rc0.d/rc6.d, which no rule may name — and it has nothing to
# remove there anyway: every install path this repo has ever had created S99 links
# in rc2-5.d with `ln -sf` and never a K link.

unlink	base	-	/etc/rc2.d/S*roomwizard-games	-	The service's former name. A card that has ever been set up by a 2025 script still has it
unlink	base	-	/etc/rc3.d/S*roomwizard-games	-	As rc2.d
unlink	base	-	/etc/rc4.d/S*roomwizard-games	-	As rc2.d
unlink	base	-	/etc/rc5.d/S*roomwizard-games	-	As rc2.d
unlink	base	-	/etc/rc2.d/S*roomwizard-app	-	Any earlier PRIORITY of our own link. The glob is the point: S50 and S99 are two links to one script, and both run
unlink	base	-	/etc/rc3.d/S*roomwizard-app	-	As rc2.d
unlink	base	-	/etc/rc4.d/S*roomwizard-app	-	As rc2.d
unlink	base	-	/etc/rc5.d/S*roomwizard-app	-	As rc2.d
unlink	base	-	/etc/init.d/avahi-daemon.orig	-	A stale copy an early commissioning/provision.sh left behind

# ═══════════════════════════════════════════════════════════════════════════
# The payload
# ═══════════════════════════════════════════════════════════════════════════

install	base	0755	/etc/init.d/audio-enable	device-files/audio-enable	Speaker amplifier GPIO12 plus the TWL4030 mixer path. Without it the panel is silent
install	base	0755	/etc/init.d/time-sync	device-files/time-sync	rdate at boot. The RTC has no battery, so an un-synced unit boots in 1970 and every mtime is wrong
install	base	0644	/etc/sysctl.d/99-security.conf	device-files/99-security.conf	randomize_va_space, dmesg_restrict, sysrq off, plus the network hardening. There is no iptables on this image
install	base	0755	/etc/init.d/roomwizard-app	device-files/roomwizard-app	The app respawn loop, and what re-runs disable-steelcase.sh on every boot. Installed under a DIFFERENT NAME from its source
install	base	0755	/opt/roomwizard/disable-steelcase.sh	device-files/disable-steelcase.sh	The Steelcase software-watchdog bypass and a fresh crontab. Re-run at every boot by the init script above

# ═══════════════════════════════════════════════════════════════════════════
# Boot links. The numbers here and clean-rules.conf's keep list are one fact
# ═══════════════════════════════════════════════════════════════════════════
#
# S28 before S29 before S30avahi, all after S20cron. Changing a number here without
# changing it there means the whitelist sweep deletes the link on the next clean —
# which is why rw_provision_check_keeps asserts the pairing rather than trusting it.

link	base	-	/etc/rc5.d/S28time-sync	../init.d/time-sync	Time before anything that writes a timestamped file
link	base	-	/etc/rc5.d/S29audio-enable	../init.d/audio-enable	Audio before the app that plays through it
link	base	-	/etc/rc2.d/S99roomwizard-app	../init.d/roomwizard-app	S99: last, so the vendor services it stops have finished starting
link	base	-	/etc/rc3.d/S99roomwizard-app	../init.d/roomwizard-app	As rc2.d
link	base	-	/etc/rc4.d/S99roomwizard-app	../init.d/roomwizard-app	As rc2.d
link	base	-	/etc/rc5.d/S99roomwizard-app	../init.d/roomwizard-app	The default runlevel; the one that matters
link-opt	mdns	-	/etc/rc5.d/S30avahi-daemon	../init.d/avahi-daemon	mDNS, so <name>.local resolves and no DHCP lease hunt is needed. The image already ships the daemon and the init script and NO link, so adding the link is the whole change. link-opt because an image without avahi must not get a dangling one

# ═══════════════════════════════════════════════════════════════════════════
# Files created in place
# ═══════════════════════════════════════════════════════════════════════════

touch	base	0644	/var/watchdog_test	-	The Steelcase software watchdog's bypass. /var is NOT tmpfs on this image (only /var/volatile is, per /etc/fstab) so it persists. Belt and braces: disable-steelcase.sh touches the same file as its FIRST command on every boot, and D9 is the open question of why a unit in service lacks it

# ═══════════════════════════════════════════════════════════════════════════
# sshd. The factory default is why this cannot wait for a second phase
# ═══════════════════════════════════════════════════════════════════════════
#
# The shipped sshd_config has PermitEmptyPasswords yes.
#
# PermitRootLogin stays "yes" and is deliberately NOT a directive here: root is the
# only account in /etc/passwd, there is no adduser on the device, and every deploy
# path is root@<ip>. "prohibit-password" would lock the unit out if keys broke, with
# no serial console to recover through.
#
# PasswordAuthentication is also not set. Turn it off by hand AFTER confirming key
# login works — the same reasoning.

backup	sshd	-	/etc/ssh/sshd_config.orig	/etc/ssh/sshd_config	Taken once and never overwritten, so the factory file survives repeated runs
directive	sshd	-	/etc/ssh/sshd_config	PermitEmptyPasswords=no	THE fix. The factory image ships "yes", which lets anyone with the IP in
directive	sshd	-	/etc/ssh/sshd_config	MaxAuthTries=3	Brute-force limit
directive	sshd	-	/etc/ssh/sshd_config	LoginGraceTime=30	Unauthenticated connections cannot sit on the 234 MB of RAM
directive	sshd	-	/etc/ssh/sshd_config	MaxSessions=5	Session limit

# ═══════════════════════════════════════════════════════════════════════════
# Config files that reference what the clean deleted
# ═══════════════════════════════════════════════════════════════════════════
#
# In-place edits, which clean-rules.conf's four record types cannot express — that
# is why they live here and not there. Both used to exist on the ONLINE path only:
# the /etc/profile one in the --remove heredoc C11 deleted, the /etc/inittab one
# inside commissioning/provision.sh's remote clean. Neither had an offline equivalent, so every
# offline-commissioned unit printed a login error.

dropline	base	-	/etc/profile	wsplatform\.conf	/etc/profile:36 is `. /home/root/data/websign/wsplatform.conf` on both card captures, and the clean deletes websign/ (half the D7b fix). Left in, every login and every non-interactive ssh prints an error for a file that is never coming back
dropline	base	-	/etc/inittab	^4:12345:respawn:/sbin/getty 38400 tty4	A getty on a port that does not exist. 1.4 MB of RSS on a 234 MB machine, and there is no serial console for it to serve (SYSTEM_ANALYSIS.md#312-serial-ports)
