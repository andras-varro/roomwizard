#
# provision-rules.conf — everything a commissioned RoomWizard ends up WITH, as DATA.
#
# The install half of what device-files/clean-rules.conf is for the delete half.
#
# ── One list, two consumers ─────────────────────────────────────────────────
#
# Read by lib/rw-provision.sh, which compiles it into a plan for whichever executor is
# running:
#
#   commissioning/provision.sh         live, over SSH, targets are already correct
#   commissioning/commission-offline.sh   offline, card in a reader, targets get $BASE/root
#
# Before this file existed the two wrote the list out separately — five scp/put
# calls, seven ln -sf calls, four sshd edits, each in two places — and they HAD
# drifted: the online path deleted stale rc*.d links before relinking and the
# offline path did not, so a card carrying an old S50roomwizard-app came out of
# offline commissioning with two links to the same init script at two priorities.
#
# ── Format: six TAB-separated fields ────────────────────────────────────────
#
#     <type>	<group>	<mode>	<target>	<source>	<reason>
#
# Blank lines and #-comments are ignored. Fewer than six fields is an ERROR, and so
# is an empty one: a missing reason is how a change gets in without anyone having to
# justify it. Use "-" for a field a type does not need — explicit, greppable, and
# distinguishable from "somebody left it blank".
#
# Every column means ONE thing for every type, so `awk -F'\t' '$3 != "-"'` really is
# "everything with a declared mode":
#
#   type       mode      target                     source
#   ────────────────────────────────────────────────────────────────────────────
#   install    0755      device path to write       repo-relative file to copy
#   link       -         the symlink to create      link target, verbatim
#   link-opt   -         ditto                      ditto; SKIPPED if it resolves
#                                                   to nothing on this image
#   unlink     -         device path or glob        -
#   touch      0644      device path                -
#   directive  -         config file                Key=Value  (written "Key Value")
#   backup     -         the copy to create         the file to copy from
#   dropline   -         config file                ERE; matching lines are removed
#
# ── ⚠️ Modes are DECLARED here, never read off disk ─────────────────────────
#
# Same rule as lib/rw-bundle.sh, same reason: /mnt/c is DrvFs, reports every file 0777
# and discards chmod, so a mode derived from the source on this host would be a
# constant rather than a measurement (CLAUDE.md). This file is the authority; the
# +x assertion in commissioning/commission-offline.sh's verify phase is a real measurement only
# because it runs against ext4.
#
# ── ⚠️ A link source must be RELATIVE ─────────────────────────────────────────
#
# "../init.d/time-sync", never "/etc/init.d/time-sync". An absolute symlink target
# is correct on a running device and DANGLING on a mounted card, where /etc is at
# $BASE/root/etc — and a dangling rc5.d link is skipped silently at boot. It is the
# one defect this file could introduce that nothing downstream would catch, so
# rw_provision_validate rejects it.
#
# ── ⚠️ Every link target must be on clean-rules.conf's keep list ─────────────
#
# A boot link installed here that the whitelist does not name is deleted by the
# next --deep-clean. That consistency used to be a comment in both files asking a
# human to remember; rw_provision_check_keeps now asserts it, because both files
# parse.
#
# ── ⚠️ rc0.d and rc6.d are unreachable from here ─────────────────────────────
#
# Shutdown, not startup. Same construction guarantee as clean-rules.conf and as p1's
# absence from RW_PART_ROLES. Note the consequence for `unlink` below.

# ═══════════════════════════════════════════════════════════════════════════
# Stale boot links, removed before anything is linked
# ═══════════════════════════════════════════════════════════════════════════
#
# THE drift this file fixes. Only the online path did this, so an offline-
# commissioned card that had ever carried an older install kept both links.
#
# `update-rc.d -f <name> remove` is deliberately NOT reproduced. It would also
# remove K links from rc0.d/rc6.d, which no rule may name — and it has nothing to
# remove there anyway: every install path this repo has ever had created S99 links
# with `ln -sf` and never a K link. The disable-steelcase.sh, watchdog_test and syslogd rows below are different: they remove
# vendor-era FILES that a unit imaged with an older bundle still carries.

unlink	base	-	/etc/rc5.d/S*roomwizard-app	-	Any earlier PRIORITY of our own link. The glob is the point: S50 and S99 are two links to one script, and both run
unlink	base	-	/opt/roomwizard/disable-steelcase.sh	-	Vendor-era script. A unit imaged with an older bundle still carries it; our root has no Steelcase software watchdog for it to bypass
unlink	base	-	/var/watchdog_test	-	The bypass file that script touched. Our root has no Steelcase watchdog test to bypass, and the hardware watchdog is fed by /sbin/watchdog (rcS.d/S06watchdog), which this file does not affect
unlink	base	-	/etc/default/syslogd	-	Vendor-era listener narrowing. Our init.d/syslog never sources it, so the file is dead; a unit imaged with an older bundle still carries it
unlink	usb	-	/etc/init.d/S89xpad-modules	-	The module loader's former name. usb_host/build-and-deploy.sh installed the init script UNDER its rc5.d priority until 2026-08-08; the rc5.d link below is relinked onto ../init.d/xpad-modules, so the old copy would otherwise sit in /etc/init.d forever — nothing sweeps that directory

# ═══════════════════════════════════════════════════════════════════════════
# The payload
# ═══════════════════════════════════════════════════════════════════════════

install	base	0755	/etc/init.d/audio-enable	device-files/audio-enable	Speaker amplifier GPIO12 plus the TWL4030 mixer path. Without it the panel is silent
install	base	0755	/etc/init.d/time-sync	device-files/time-sync	rdate at boot. The RTC has no battery, so an un-synced unit boots in 1970 and every mtime is wrong
install	base	0644	/etc/sysctl.conf	device-files/sysctl.conf	The one file our rcS.d/S05sysctl applies (sysctl -p /etc/sysctl.conf); nothing reads /etc/sysctl.d. randomize_va_space, dmesg_restrict, sysrq off, the network hardening. There is no iptables on this image
install	base	0755	/etc/init.d/roomwizard-app	device-files/roomwizard-app	The app respawn loop: restarts the default app whenever it exits, so leaving a game returns to the launcher. Installed under a DIFFERENT NAME from its source
install	base	0755	/etc/init.d/rwmond	device-files/rwmond	Boot start for the Monitor page's history daemon /opt/games/rwmond (a native_apps binary): CPU, memory and SoC temperature once a second into a two minute ring on tmpfs. Prints one line and does nothing where native_apps is not deployed
install	mdns	0644	/etc/avahi/avahi-daemon.conf	device-files/avahi-daemon.conf	The image's own file with four values changed: allow-interfaces=eth0, use-ipv6=no, enable-wide-area=no (which also drops a random-port UDP socket), enable-reflector=no. In mdns, so --no-mdns leaves avahi untouched
install	base	0755	/etc/init.d/touch-module	device-files/touch-module	insmod of cy8ctmg120_ts.ko, our touchscreen driver, on a unit that boots our own kernel image. It loads only when I2C client 2-0003 has no driver, so on the vendor kernel, where the built-in panjit_ts owns it, it is a no-op. The .ko is a build artifact from kernel/build-modules.sh --deploy, like the usb group's; without it the script prints one line

# ── USB host mode, the Xbox controller and USB audio ───────────────────────────────────
#
# ⚠️ usb_host lives entirely on p6, and nothing here touches p1. The /dev/mem
# patch of omap2430_ops (which forces IRQ-driven PIO — it does not fix DMA) and
# the force-loaded modules — xpad/joydev/ff-memless for the pad, and the four
# snd-* for a USB DAC — are all here or in the bundle.
#
# The eight BINARIES these scripts drive — /usr/local/bin/devmem_write and the
# seven /lib/modules/4.14.52/extra/*.ko — are build artifacts and travel in the
# bundle (lib/rw-bundle.sh), not here. Without them /etc/init.d/usb-host says
# "devmem_write not found", xpad-modules' insmods are no-ops and usb-audio-modules
# names each missing .ko: a few noisy boot lines, nothing broken. --no-usb skips
# this whole group.

install	usb	0755	/usr/local/bin/enable-usb-host.sh	device-files/enable-usb-host.sh	The /dev/mem patch itself: noop stubs into omap2430_ops.dma_init/.dma_exit, then a MUSB rebind. Self-verifies against quirks == 0x00000004 before writing, and is idempotent
install	usb	0755	/etc/init.d/usb-host	device-files/usb-host	Runs the above at every boot — the patched struct is static kernel memory, so it survives until reboot and no further, which is why this is a boot script. Also carries the `recover` verb, the one userspace remedy measured to revive a dead port (a driver re-probe). ⚠️ It is deliberately NOT on a timer
install	usb	0755	/etc/init.d/xpad-modules	device-files/xpad-modules	insmod -f of ff-memless, joydev and xpad. CONFIG_MODULE_SIG is unset on this kernel, so a force-load of out-of-tree modules is accepted. Installed under a DIFFERENT NAME from its former /etc/init.d/S89xpad-modules — see the unlink above
install	usb	0755	/etc/init.d/usb-audio-modules	device-files/usb-audio-modules	insmod of snd-hwdep, snd-rawmidi, snd-usbmidi-lib and snd-usb-audio, in dependency order. SND_USB_AUDIO selects the first two and this kernel exports neither, so all four have to be modules. Kept separate from xpad-modules because the two loads share no ordering constraint and a script named for the pad must not quietly load sound drivers
install	bluetooth	0755	/etc/init.d/bluetooth	device-files/bluetooth	Boot start for Bluetooth: insmods the bluetooth component's modules from /lib/modules/4.14.52/bt in its load-order.txt, then starts bluetoothd. Only on our own kernel image — the modules are built against its symbol CRCs, so on the vendor kernel it prints one line and loads nothing. Also backgrounds the reconnect watcher, which connects the trusted, bonded devices at boot and whenever hci0 is re-created, since BlueZ 5.66 initiates no BR/EDR connection when an adapter powers up
install	bluetooth	0644	/etc/dbus-1/system.d/bluetooth.conf	device-files/bluetooth.conf	The dbus policy that lets bluetoothd own org.bluez. Without it bluetoothd exits at start-up. BlueZ 5.66's own src/bluetooth.conf, byte for byte
install	bluetooth	0644	/etc/bluetooth/main.conf	device-files/bluetooth-main.conf	[Policy] AutoEnable=true: bluetoothd powers an adapter whenever it appears. [General] AlwaysPairable=true: the adapter stays bondable with no agent registered, so a pairing stores its link key and a headset reconnects after a power cycle. The dongle re-enumerates with the whole USB tree (a plug on the port does it), and without this the recreated hci0 comes back unpowered. Installed under a DIFFERENT NAME from its source
install	bluetooth	0644	/etc/bluetooth/input.conf	device-files/bluetooth-input.conf	[General] ClassicBondedOnly=true: bluetoothd accepts a classic HID connection only from a bonded device (CVE-2023-45866; 5.66 defaults it false, 5.71 flipped the default). Relies on main.conf AlwaysPairable=true, which is what makes a pairing store its link key. Installed under a DIFFERENT NAME from its source
install	bluetooth	0644	/etc/dbus-1/system.d/bluealsa.conf	device-files/bluealsa.conf	The dbus policy that lets the bluealsa daemon own org.bluealsa. Without it bluealsa exits at start-up. BlueALSA 4.3.1's own policy file as its build installs it, byte for byte
install	bluetooth	0644	/etc/alsa/conf.d/20-bluealsa.conf	device-files/20-bluealsa.conf	Defines the bluealsa PCM and ctl for ALSA clients. The vendor libasound's alsa.conf load hook reads /etc/alsa/conf.d, not /usr/share/alsa/alsa.conf.d. BlueALSA 4.3.1's own file as its build installs it, byte for byte

# ═══════════════════════════════════════════════════════════════════════════
# Boot links. The numbers here and clean-rules.conf's keep list are one fact
# ═══════════════════════════════════════════════════════════════════════════
#
# S28 before S29 before S30avahi, all after S20hwclock.sh. Changing a number here without
# changing it there means the whitelist sweep deletes the link on the next clean —
# which is why rw_provision_check_keeps asserts the pairing rather than trusting it.

link	base	-	/etc/rc5.d/S28time-sync	../init.d/time-sync	Time before anything that writes a timestamped file
link	base	-	/etc/rc5.d/S29audio-enable	../init.d/audio-enable	Audio before the app that plays through it
link	base	-	/etc/rc5.d/S31touch-module	../init.d/touch-module	Touch before the app: app_launcher exits when /dev/input/touchscreen0 is missing. clean-rules.conf keeps this exact path
link	base	-	/etc/rc5.d/S95rwmond	../init.d/rwmond	S95: after everything it samples is up, before S99roomwizard-app starts the launcher whose Monitor page reads it. clean-rules.conf keeps this exact path
link	base	-	/etc/rc5.d/S99roomwizard-app	../init.d/roomwizard-app	The default runlevel; the one that matters
link-opt	mdns	-	/etc/rc5.d/S30avahi-daemon	../init.d/avahi-daemon	mDNS, so <name>.local resolves and no DHCP lease hunt is needed. The image already ships the daemon and the init script and NO link, so adding the link is the whole change. link-opt because an image without avahi must not get a dangling one
link	usb	-	/etc/rc5.d/S88usb-audio-modules	../init.d/usb-audio-modules	S88: below S90 like S89, but the sound modules have no ordering requirement of their own — registering a USB interface driver re-probes devices already on the bus, so the dongle is claimed whenever this runs. The number is only here to make the sorted order deterministic. clean-rules.conf keeps this exact path, which is what rw_provision_check_keeps asserts
link	usb	-	/etc/rc5.d/S89xpad-modules	../init.d/xpad-modules	S89: the controller modules must be loaded before usb-host rebinds MUSB, or the pad enumerates with no driver to claim it. clean-rules.conf:152 already keeps this exact path, which is what rw_provision_check_keeps asserts
link	usb	-	/etc/rc5.d/S90usb-host	../init.d/usb-host	S90: after S89. clean-rules.conf:153 keeps it
link	bluetooth	-	/etc/rc5.d/S91bluetooth	../init.d/bluetooth	S91: after S90usb-host, because the dongle is on that port — though btusb also claims an adapter that enumerates later, and bluetoothd picks it up when it appears. After S02dbus-1, which bluetoothd needs. clean-rules.conf keeps this exact path

# ═══════════════════════════════════════════════════════════════════════════
# Files created in place
# ═══════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════
# sshd. The factory default is why this cannot wait for a second phase
# ═══════════════════════════════════════════════════════════════════════════
#
# The shipped sshd_config has PermitEmptyPasswords yes. Measured from both card
# captures: nothing on the image rewrites sshd_config at boot (only the file
# itself, the init script and the binaries name it), there is no
# /etc/default/ssh, so init.d/sshd starts sshd with no -f and
# sshd_config_readonly — the stock read-only-rootfs variant, read only through
# SSHD_OPTS in that absent file — is never used. These edits therefore persist.
#
# The config names no HostKey, so sshd loads its compiled-in rsa/ecdsa/ed25519
# defaults and never the DSA key init.d/sshd generates; HostKeyAlgorithms below
# would refuse ssh-dss even if it did.
#
# ── Crypto: explicit allow-lists, in every auth mode ────────────────────────
#
# Each list is the 8.3p1 binary's own compiled-in default (measured with grep -a
# on the capture's /usr/sbin/sshd) with the SHA-1 entries (and, for MACs, umac) removed,
# so nothing else the unit already negotiates disappears. Allow-lists rather than the
# `-name` removal syntax: a removal inherits whatever a future default adds, and
# an allow-list is what `sshd -T` prints back verbatim, so it can be compared.
# Ciphers stays CTR-only, which is also what keeps Terrapin out: it needs
# chacha20-poly1305 or a CBC cipher with an EtM MAC, and neither is offered.
# No umac: umac-64 has a 64-bit tag, and umac-128 (etm or not) fails Windows
# OpenSSH 9.5p2 with "Corrupted MAC on input" against this sshd 8.3 — measured
# 2026-10-04; OpenSSH 8.2/10.3 negotiate it fine. hmac-sha2-* works on all three.
# ssh-rsa is only the SHA-1 SIGNATURE name; RSA keys keep working through
# rsa-sha2-256/512, which every OpenSSH since 7.2 offers.
#
# ── Authentication: --ssh-auth=password|key, ONE group per run ──────────────
#
# sshd-password is today's behaviour, pinned. sshd-key turns every password path
# off — PasswordAuthentication, and keyboard-interactive, which with UsePAM yes is
# a second way to type a password — and lets root in by key only. Neither path
# applies sshd-key without proof that a key works: provision.sh logs in with
# BatchMode first, commission-offline.sh requires card-prep.sh to have written
# authorized_keys in the same run. After writing, provision.sh runs sshd -t,
# restores the previous file on failure, and re-proves the key login on a FRESH
# connection or the device puts the old file back by itself (lib/rw-sshd.sh).

backup	sshd	-	/etc/ssh/sshd_config.orig	/etc/ssh/sshd_config	Taken once and never overwritten, so the factory file survives repeated runs
directive	sshd	-	/etc/ssh/sshd_config	PermitEmptyPasswords=no	THE fix. The factory image ships "yes", which lets anyone with the IP in
directive	sshd	-	/etc/ssh/sshd_config	MaxAuthTries=3	Brute-force limit
directive	sshd	-	/etc/ssh/sshd_config	LoginGraceTime=30	Unauthenticated connections cannot sit on the 234 MB of RAM
directive	sshd	-	/etc/ssh/sshd_config	MaxSessions=5	Session limit
directive	sshd	-	/etc/ssh/sshd_config	PubkeyAuthentication=yes	Explicit, because sshd-key depends on it and the vendor file only has it commented
directive	sshd	-	/etc/ssh/sshd_config	Ciphers=aes128-ctr,aes192-ctr,aes256-ctr	The vendor's own line, pinned: no chacha20-poly1305 and no CBC, so no Terrapin
directive	sshd	-	/etc/ssh/sshd_config	MACs=hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512	The default minus SHA-1 and every umac (umac-128 breaks Windows OpenSSH 9.5)
directive	sshd	-	/etc/ssh/sshd_config	KexAlgorithms=curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256	Exactly the 8.3p1 default, which has no SHA-1 — pinned so it stays that way
directive	sshd	-	/etc/ssh/sshd_config	HostKeyAlgorithms=ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp384-cert-v01@openssh.com,ecdsa-sha2-nistp521-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,sk-ecdsa-sha2-nistp256@openssh.com,ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256	The default minus ssh-rsa and ssh-rsa-cert-v01 (SHA-1 signatures); the RSA host key is still offered as rsa-sha2
directive	sshd	-	/etc/ssh/sshd_config	PubkeyAcceptedKeyTypes=ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp384-cert-v01@openssh.com,ecdsa-sha2-nistp521-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,sk-ecdsa-sha2-nistp256@openssh.com,ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256	Same list for client keys. The 8.3 name; 8.5 renamed it and kept this one as an alias
directive	sshd-password	-	/etc/ssh/sshd_config	PasswordAuthentication=yes	Today's behaviour, pinned so that re-running in this mode undoes key-only
directive	sshd-password	-	/etc/ssh/sshd_config	ChallengeResponseAuthentication=no	The vendor's value: the password arrives through PasswordAuthentication alone
directive	sshd-password	-	/etc/ssh/sshd_config	KbdInteractiveAuthentication=no	As above; the server then offers (publickey,password), which lib/rw-ssh.sh's notes describe
directive	sshd-password	-	/etc/ssh/sshd_config	PermitRootLogin=yes	Root is the only account in /etc/passwd and there is no adduser on the device
directive	sshd-key	-	/etc/ssh/sshd_config	PasswordAuthentication=no	Key-only. Applied only after a key login has been proven (provision.sh) or installed this run (offline)
directive	sshd-key	-	/etc/ssh/sshd_config	ChallengeResponseAuthentication=no	With UsePAM yes this is a second password prompt, so it goes too
directive	sshd-key	-	/etc/ssh/sshd_config	KbdInteractiveAuthentication=no	The same path under its other name; 8.3 has both keywords
directive	sshd-key	-	/etc/ssh/sshd_config	PermitRootLogin=prohibit-password	Root by key only. Not "no": root is the only account

