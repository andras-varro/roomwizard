#
# clean-rules.conf — every keep/delete decision for a RoomWizard, as DATA.
#
# ── One list, two consumers ─────────────────────────────────────────────────
#
# Read by rw-clean.sh, which compiles it into a plan for whichever executor is
# running:
#
#   setup-device.sh --deep-clean   live, over SSH, base = /
#   commission-offline.sh          offline, card in a reader, base = a mount point
#
# The two cannot drift because there is only one set of decisions. They keep
# SEPARATE executors on purpose: "/" is the correct prefix on the device and a
# refused one offline, so rw-clean.sh's del() demands a non-empty, non-"/" base
# and the device-side one does not (IMPROVEMENT_PLAN.md F10).
#
# ── Format: four TAB-separated fields ───────────────────────────────────────
#
#     <type>	<group>	<path>	<reason>
#
# Blank lines and #-comments are ignored. A line with fewer than four fields is
# an ERROR, not a warning: a missing reason is how a delete gets in without
# anyone having to justify it.
#
#   scope     PATH is a directory to be SWEPT: every direct child that no `keep`
#             covers is deleted. This is what makes an unrecognised vendor
#             service on a unit nobody has inspected removed BY CONSTRUCTION,
#             with no new blacklist entry. Children only — a scope never
#             recurses, so a kept directory's contents are never examined.
#   keep      PATH survives every sweep. A keep is ABSOLUTE: no flag turns one
#             into a delete. Globs (* ? [..]) are allowed and match a child name.
#   delete    PATH is removed when its group is enabled. Globs allowed.
#   truncate  PATH is emptied in place, not unlinked. For a file something else
#             owns — /var/cron/tabs/root is reached through a symlink into p2,
#             so removing the directory it lives in destroys cron's spool root
#             (SYSTEM_ANALYSIS.md#52-as-we-run-it--game-mode).
#
# ── Groups ──────────────────────────────────────────────────────────────────
#
# A group is a named body of deletions that can be switched off.
#
#   base      always applied; --keep-base is rejected
#   sweeps    every `scope` record, i.e. the whitelist sweeps  (--keep-sweeps)
#   browser   GTK3 / WebKit / Xorg / GStreamer / CJK fonts     (--keep-browser)
#   java      OpenJRE / Jetty / HSQLDB                         (--keep-java)
#   snmp      net-snmp                                         (--keep-snmp)
#   mail      nullmailer / mutt                                (--keep-mail)
#   extras    aspell, lftp, enchant, tslib, orphan libpython   (--keep-extras)
#   factory   the 472 MB on-device restore payload             (--keep-factory)
#
# EVERY group is on by default. `--keep-<group>` is the only way to switch one off.
#
# ── ⚠️ Why `factory` is on by default ───────────────────────────────────────
#
# Reversed 2026-08-06, from opt-in to opt-out. Choosing to clean a unit of its
# vendor software is a DECISION, and it must not be undoable by a button press.
# Half-doing it is also incoherent: this clean removes the vendor stack the
# payload restores AND the mechanism that would run the restore, so what survives
# is 472 MB retaining only the ability to undo a commissioning it can no longer
# perform. The real gate is asked once and up front — did you back up the card?
# A host-side full-card image is the recovery path and a strictly better one.
# `factory/uImage-system-original`, the 5 MB fallback kernel, is KEPT either way.
#
# ── ⚠️ Why `sweeps` is a group ──────────────────────────────────────────────
#
# So that `--remove` can be a SUBSET of this one plan instead of a second list.
# --remove is exactly `--deep-clean --keep-sweeps`: the named vendor stacks go and
# a directory no `keep` names stays. It used to be ~85 lines of hardcoded `rm -rf`
# inside an ssh heredoc in setup-device.sh, which restated decisions recorded here
# and had already drifted from them in two places — it deleted
# /home/root/log/concurrent.log, which syslogd holds open, and it carried its own
# keep-comments for /opt/pv02 and /opt/sound.
#
# Note that the `keep` records stay in `base` and NOT in `sweeps`: rw_clean_plan
# DROPS a disabled group's keeps, so filing them under `sweeps` would silently
# unprotect all sixty of them whenever the sweeps were switched off.
#
# ⚠️ A DISABLED group's paths are protected from every sweep, not merely skipped
# by their own delete line. Without that rule `--keep-java` would leave
# /opt/openjre-8 named by a disabled delete and then have the /opt sweep remove
# it anyway — the flag would do nothing and say nothing.
#
# What --keep-<group> does NOT do is re-enable a boot link. The rc*.d whitelist
# is the mechanism that removes an unknown vendor service by construction, and
# punching a per-stack hole in it would defeat that. --keep-browser leaves the
# browser on disk; starting it is a manual `ln -s` away.
#
# ── Where the rc*.d keep-lists come from ────────────────────────────────────
#
# Measured on a unit in service on 2026-08-05 (games running, 4 days uptime) and
# re-read on a second unit on 2026-08-05: SYSTEM_ANALYSIS.md#52-as-we-run-it--game-mode.
# That table IS this whitelist. It cannot be derived on the dev host — both card
# captures were copied through Windows and lost every symlink, so their rc*.d
# are empty directories (CLAUDE.md → "Working from this host").
#
# ⚠️ rc0.d and rc6.d are SHUTDOWN, not startup. They are in no scope and no
# delete line here, and tests/rw_clean_test.sh asserts their absence — the same
# guarantee-by-unreachability as p1's absence from RW_PART_ROLES. They carry
# umountfs, sendsigs and save-rtc.sh; a unit that cannot unmount cleanly is a
# unit whose next fsck is not optional.
#
# ── Three deliberate differences from the retired setup-device.sh delete list ─
#
# That list is gone (2026-08-06); these three are where it and this file disagreed
# and this file won, so they are the cases to re-read before "restoring" anything.
#
#   1. /etc/rcS.d/S45mountnfs.sh is KEPT. The old list deleted it; the unit in
#      service has it and boots, so the measurement wins over the guess.
#   2. /opt is swept rather than blacklisted, so a vendor directory nobody has
#      seen goes without a new entry. /opt/{pv02,sound,sbin} are kept per F10.
#   3. /home/root/log/concurrent.log is KEPT and truncated. The old list `rm -f`ed
#      it; syslogd holds it open (measured from /proc/<pid>/fd on a unit in
#      service), so unlinking it live leaves syslogd writing to an unlinked inode
#      and logging silently stops until the next reboot.
#
# The old list also wrote /home/root/bloatware-removed.txt, a receipt naming a
# fixed six-item list and hardcoded sizes it never measured. Not reproduced: this
# file and its reasons are the record.

# ═══════════════════════════════════════════════════════════════════════════
# What can START: the whitelists
# ═══════════════════════════════════════════════════════════════════════════

scope	sweeps	/etc/rcS.d	Everything that runs before runlevel 5. Whitelist, so an unrecognised vendor service is removed without naming it
keep	base	/etc/rcS.d/S02banner.sh	Login banner; also the last-resort rootfs identity marker rw_is_rootfs falls back on
keep	base	/etc/rcS.d/S03sysfs.sh	Mounts /sys
keep	base	/etc/rcS.d/S04udev	Device nodes, including /dev/fb0 and /dev/input/event*
keep	base	/etc/rcS.d/S05modutils.sh	Loads /etc/modules
keep	base	/etc/rcS.d/S06alignment.sh	ARM unaligned-access trap policy
keep	base	/etc/rcS.d/S06devpts.sh	Mounts /dev/pts, without which sshd cannot allocate a tty
keep	base	/etc/rcS.d/S10checkroot.sh	Root filesystem check and remount rw
keep	base	/etc/rcS.d/S30procps.sh	Applies /etc/sysctl.d, i.e. 99-security.conf
keep	base	/etc/rcS.d/S30ramdisk	Vendor ramdisk setup, present on every unit that boots
keep	base	/etc/rcS.d/S35mountall.sh	Mounts /etc/fstab, i.e. p2/p3/p5 onto /home/root/{data,log,backup}
keep	base	/etc/rcS.d/S37populate-volatile.sh	Populates /var/volatile, the one real tmpfs
keep	base	/etc/rcS.d/S39hostname.sh	Applies /etc/hostname to the running kernel
keep	base	/etc/rcS.d/S40networking	ifupdown; the DHCP path commissioning configures
keep	base	/etc/rcS.d/S43syslog	Logging. Offline post-mortem of a failed boot reads p3, which only helps if syslog started
keep	base	/etc/rcS.d/S45mountnfs.sh	Measured present on a unit that boots; the old delete list removed it on a guess
keep	base	/etc/rcS.d/S55bootmisc.sh	/var/run, /tmp, motd
keep	base	/etc/rcS.d/S99finish.sh	Ends the S sequence

scope	sweeps	/etc/rc5.d	The default runlevel. This sweep is the whole cleanup criterion: what runs, not what it costs
keep	base	/etc/rc5.d/S02dbus-1	System message bus; avahi-daemon's Required-Start
keep	base	/etc/rc5.d/S09sshd	Remote access. Deleting this makes a unit unreachable with no serial console to recover from
keep	base	/etc/rc5.d/S20cron	Runs the two surviving jobs disable-steelcase.sh's crontab keeps
keep	base	/etc/rc5.d/S28time-sync	Ours: rdate at boot, which matters because the RTC has no battery
keep	base	/etc/rc5.d/S29audio-enable	Ours: speaker amplifier GPIO12 + TWL4030 mixer path
keep	base	/etc/rc5.d/S30avahi-daemon	Ours: mDNS, so <name>.local resolves. Closes D8 — the deep clean used to delete the daemon this link points at
keep	base	/etc/rc5.d/S40ctrlblk	Vendor boot_tracker management. Untouched deliberately; it writes p1's ctrlblock.bin
keep	base	/etc/rc5.d/S50watchdog	HARDWARE watchdog feeder. Without it the device hard-resets every 60 s
keep	base	/etc/rc5.d/S89xpad-modules	usb_host component, where installed: Xbox controller modules
keep	base	/etc/rc5.d/S90usb-host	usb_host component, where installed: USB host-mode enablement
keep	base	/etc/rc5.d/S99roomwizard-app	Ours: the app respawn loop, and what re-runs disable-steelcase.sh on every boot

scope	sweeps	/etc/rc2.d	Runlevels 2-4 are not used but are reachable; sweep them on the same criterion
keep	base	/etc/rc2.d/S02dbus-1	As rc5.d
keep	base	/etc/rc2.d/S09sshd	As rc5.d
keep	base	/etc/rc2.d/S20hwclock.sh	Measured present in rc2-4.d and absent from rc5.d
keep	base	/etc/rc2.d/S40ctrlblk	As rc5.d
keep	base	/etc/rc2.d/S50watchdog	As rc5.d
keep	base	/etc/rc2.d/S99roomwizard-app	As rc5.d
keep	base	/etc/rc2.d/S99stop-bootlogd	Measured present in rc2-4.d

scope	sweeps	/etc/rc3.d	As rc2.d
keep	base	/etc/rc3.d/S02dbus-1	As rc5.d
keep	base	/etc/rc3.d/S09sshd	As rc5.d
keep	base	/etc/rc3.d/S20hwclock.sh	As rc2.d
keep	base	/etc/rc3.d/S40ctrlblk	As rc5.d
keep	base	/etc/rc3.d/S50watchdog	As rc5.d
keep	base	/etc/rc3.d/S99roomwizard-app	As rc5.d
keep	base	/etc/rc3.d/S99stop-bootlogd	As rc2.d

scope	sweeps	/etc/rc4.d	As rc2.d
keep	base	/etc/rc4.d/S02dbus-1	As rc5.d
keep	base	/etc/rc4.d/S09sshd	As rc5.d
keep	base	/etc/rc4.d/S20hwclock.sh	As rc2.d
keep	base	/etc/rc4.d/S40ctrlblk	As rc5.d
keep	base	/etc/rc4.d/S50watchdog	As rc5.d
keep	base	/etc/rc4.d/S99roomwizard-app	As rc5.d
keep	base	/etc/rc4.d/S99stop-bootlogd	As rc2.d

scope	sweeps	/opt	Vendor payload plus ours. A working unit holds exactly games roomwizard sbin vnc_client; anything else is vendor software with a service behind it
keep	base	/opt/games	Ours: the native binaries
keep	base	/opt/roomwizard	Ours: .app manifests, icons, default-app, disable-steelcase.sh
keep	base	/opt/vnc_client	Ours: the VNC client component
keep	base	/opt/scummvm	Ours: the ScummVM port, where installed
keep	base	/opt/sbin	1.4 MB of vendor scripts, inert once nothing starts them, and the reference SYSTEM_ANALYSIS.md#35-network-and-power was read out of. Includes the ZigBee tooling F5 needs
keep	base	/opt/sound	113 KB of usable UI WAVs (asl_click, asl_error, asl_success) that common/audio.c can play
keep	base	/opt/pv02	44 KB vendor factory-test tool; an rw_is_rootfs identity marker and a hardware reference

scope	sweeps	/home/root/data	p2. Vendor config and our high scores. Whitelist: a vendor directory nobody has inspected goes
keep	base	/home/root/data/lost+found	ext4 requires it
keep	base	/home/root/data/cron	cron's spool ROOT. /var/cron/tabs/root is a symlink into here, so deleting this directory destroys the crontab and cron itself
keep	base	/home/root/data/*.hig	Our high scores. The one thing on this partition a user would miss

scope	sweeps	/home/root/log	p3. Vendor logs only; rotatelogfiles.sh recreates what it needs
keep	base	/home/root/log/lost+found	ext4 requires it
keep	base	/home/root/log/messages	syslogd's own target per /etc/syslog.conf, and it holds the fd open — deleting it live leaves syslogd writing to an unlinked inode and logging silently stops until reboot. Truncated below instead
keep	base	/home/root/log/upgrade.log	Also open in syslogd (measured from /proc/<pid>/fd on a unit in service, 2026-08-05)
keep	base	/home/root/log/concurrent.log	Also open in syslogd, same measurement
keep	base	/home/root/log/wtmp	Login records; sshd and login hold it open
keep	base	/home/root/log/lastlog	Login records; same

scope	sweeps	/home/root/backup	p5. Upgrade payload, vendor identity, log churn
keep	base	/home/root/backup/lost+found	ext4 requires it
keep	base	/home/root/backup/serialno	Device identity, and the only per-unit fact on the card that is not a UUID
keep	base	/home/root/backup/pointercal	The vendor's own tslib touch calibration. Inert (we read /etc/touch_calibration.conf) but it is a measurement of this panel
keep	base	/home/root/backup/factory	Holds uImage-system-original — a 5 MB local fallback kernel, which is cheap insurance given p1 is never written. The DIRECTORY is kept under every group selection; its 472 MB of restore images are the `factory` group below and go by default

truncate	base	/home/root/data/cron/tabs/root	The vendor crontab: watchdog.sh, get_time_from_server.sh, runfsck.sh, adjustbklight.sh and seven more. Truncated, never unlinked — see `keep /home/root/data/cron`. disable-steelcase.sh writes a fresh one on every boot, so this only closes the window between S20cron and S99roomwizard-app
truncate	base	/home/root/data/cron/log	Accumulating since 2017; 79-131 MB measured. Truncated because cron holds it open
truncate	base	/home/root/log/messages	449 KB of vendor noise on a unit in service. Truncated rather than deleted because syslogd has it open
truncate	base	/home/root/log/upgrade.log	Open in syslogd
truncate	base	/home/root/log/concurrent.log	Open in syslogd
truncate	base	/home/root/log/wtmp	Login records from the vendor's era
truncate	base	/home/root/log/lastlog	Login records from the vendor's era

# ═══════════════════════════════════════════════════════════════════════════
# Named stacks inside the base OS. Never /lib, /etc, /bin, /sbin
# ═══════════════════════════════════════════════════════════════════════════

delete	base	/home/root/data/websign	The boot-time network regenerator's INPUT. Deleting it is half of the D7b fix; the other half is /etc/rcS.d/S60networkmanager, which the rcS.d sweep above removes
delete	base	/etc/init.d/networkmanager	The regenerator itself. Nothing else starts dhclient with -sf /etc/dhclient-script, which is the only writer of the bogus non-loopback /etc/hosts line
delete	base	/home/root/backup/websigns	Vendor web-signage payload
delete	base	/home/root/sqltool.rc	HSQLDB client config
delete	base	/var/crontab.steelcase.bak	Backup of the crontab we replace
delete	base	/home/root/data/conctest	Vendor concurrency test data
delete	base	/home/root/data/rwdb	HSQLDB room-booking database
delete	base	/etc/init.d/vsftpd	FTP server: a service, and a security risk
delete	base	/etc/init.d/webserver	Jetty wrapper
delete	base	/etc/init.d/browser	Epiphany/WebKit launcher
delete	base	/etc/init.d/x11	Xorg
delete	base	/etc/init.d/startautoupgrade	Steelcase OTA. Whether it can fire unattended is unestablished; removing it makes the question moot
delete	base	/etc/init.d/upgradecomplete	The other half of the OTA path
delete	base	/etc/init.d/webmonitor	Watches the browser we deleted
delete	base	/etc/init.d/mta.sh	Mail transport
delete	base	/etc/init.d/ntpd	Replaced by our time-sync
delete	base	/etc/init.d/cursor.sh	Shows an X cursor
delete	base	/etc/init.d/psplash	Splash screen; it holds /dev/fb0
delete	base	/etc/init.d/bootscrub	Vendor boot-time scrub
delete	base	/etc/init.d/cleaup_partition	Vendor partition cleaner (sic)
delete	base	/etc/init.d/rmnologin.sh	Only meaningful with the vendor login flow
delete	base	/etc/init.d/wpa_supplicant	No WiFi hardware on this board
delete	base	/etc/init.d/avahi-daemon.orig	Any stale copy left by an earlier setup run
delete	base	/usr/sbin/wpa_supplicant	No WiFi hardware
delete	base	/usr/sbin/ntpd.ntp	Replaced by time-sync
delete	base	/usr/sbin/vsftpd	FTP server
delete	base	/etc/vsftpd.conf	FTP config
delete	base	/etc/wpa_supplicant*	WiFi config
delete	base	/etc/ntp.conf	NTP config
delete	base	/etc/ntp.conf.template	NTP config
delete	base	/var/lib/ntp	NTP state
# ⚠️ The eight vendor logs below are named EXPLICITLY even though `scope /home/root/log`
# would sweep every one of them. The sweep is in the `sweeps` group, and --remove runs
# without it — so with only the sweep to rely on, --remove would leave the vendor's logs
# on the device, which the ~85-line heredoc it replaced did not. Measured: the C11 plan
# diff reported 13 unaccounted-for targets against --remove's plan and 0 against
# --deep-clean's, which is exactly how a fold looks when it is checked against the
# wrong plan. Named as /home/root/log/* and not /var/log/*: same inodes through the
# p3 symlink on a device, and only this form resolves on a card with p6 mounted.
delete	base	/home/root/log/Xorg.0.log	Xorg's log. The X server is deleted by the browser group and there is no GPU on this part
delete	base	/home/root/log/browser.err	Epiphany/WebKit stderr
delete	base	/home/root/log/get_time_from_server.err	The vendor time sync's errors; replaced by our time-sync
delete	base	/home/root/log/jettystart	Jetty start-up log
delete	base	/home/root/log/hsqldbstart	HSQLDB start-up log
delete	base	/home/root/log/snmp_daemon.log	snmpd's log
delete	base	/home/root/log/networkmngr.err	The boot-time network regenerator's errors — the D7b component
delete	base	/home/root/log/jetty_logs	Jetty's request-log directory
# /var/log is a SYMLINK to /home/root/log (p3), measured on a unit in service, so
# every vendor log there is already covered by the `scope /home/root/log` sweep
# above. Naming them as /var/log/* would also not work offline: on a card with
# only p6 mounted that symlink dangles.

