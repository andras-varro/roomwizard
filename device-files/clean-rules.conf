delete	extras	/usr/share/sounds	ALSA test WAVs. NOT /usr/share/alsa, which the OSS shim needs

delete	factory	/home/root/backup/factory/sd_rootfs_part.img*	444 MB self-restore image. Deleted BY DEFAULT: it restores the vendor stack this clean removes, and the clean also removes the mechanism that would run it. PRECONDITION — a host-side full-card backup, which every bring-up path asks for before it starts. --keep-factory opts out
delete	factory	/home/root/backup/factory/sd_boot_archive.tar.gz*	22 MB p1 archive, part of the same self-restore set
delete	factory	/home/root/backup/factory/sd_data_part.img*	12 MB p2 image
delete	factory	/home/root/backup/factory/sd_log_part.img*	10 MB p3 image
