# /etc/bluetooth/main.conf -- installed by the bluetooth provision group. Minimal on purpose:
# every key not set here keeps BlueZ 5.66's built-in default.
#
# AutoEnable powers every adapter as it appears, including one that comes back
# mid-session: the RTL8761CU dongle re-enumerates whenever the single USB port's tree
# does (measured on .188: hci0 was recreated, and bluetoothd re-registered it
# "Powered: no" with its bonds intact). A power-on at boot alone would miss that.
# With NO main.conf, 5.66's plugins/policy.c returns before reading [Policy] and
# AutoEnable stays false, which is the measured behaviour; the key is set explicitly.
[Policy]
AutoEnable=true
